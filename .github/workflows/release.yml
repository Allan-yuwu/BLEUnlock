name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
  workflow_dispatch:
    inputs:
      tag:
        description: "vX.Y.Z to publish from master, or an existing tag to verify"
        required: true
        type: string

permissions:
  contents: write
  actions: read

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

jobs:
  build-and-release:
    runs-on: macos-26

    steps:
      - name: Checkout master or existing release tag
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && 'refs/heads/master' || github.ref }}
          fetch-depth: 0

      - name: Validate release metadata
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ ! "${RELEASE_TAG}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Release tag must match vX.Y.Z: ${RELEASE_TAG}" >&2
            exit 1
          fi

          VERSION="${RELEASE_TAG#v}"
          for changelog in CHANGELOG.md CHANGELOG.cn.md; do
            if ! grep -Fqx "## ${VERSION}" "${changelog}"; then
              echo "${changelog} has no exact section for ${VERSION}." >&2
              exit 1
            fi
          done
          [[ "${GITHUB_REPOSITORY}" == "Allan-yuwu/BLEUnlock" ]] || {
            echo "This workflow publishes Allan-yuwu/BLEUnlock only." >&2
            exit 1
          }
          git merge-base --is-ancestor HEAD origin/master

          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" && "${GITHUB_REF}" != "refs/heads/master" ]]; then
            echo "Dispatch releases from master only." >&2
            exit 1
          fi
          HEAD_COMMIT="$(git rev-parse HEAD)"
          if git show-ref --verify --quiet "refs/tags/${RELEASE_TAG}"; then
            TAG_COMMIT="$(git rev-list -n 1 "${RELEASE_TAG}")"
            [[ "${TAG_COMMIT}" == "${HEAD_COMMIT}" ]] || {
              echo "Existing tag points to another commit; tags are never moved." >&2
              exit 1
            }
            echo "RELEASE_TAG_EXISTS=1" >> "${GITHUB_ENV}"
          else
            [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]] || exit 1
            echo "RELEASE_TAG_EXISTS=0" >> "${GITHUB_ENV}"
          fi
          PASSED_RUNS="$(gh api --method GET "repos/${GITHUB_REPOSITORY}/actions/workflows/test.yml/runs" \
            -f head_sha="${HEAD_COMMIT}" -f branch=master -f status=success --jq '.workflow_runs | length')"
          [[ "${PASSED_RUNS}" -gt 0 ]] || {
            echo "The current master commit has no successful CI workflow run." >&2
            exit 1
          }

      - name: Import code-signing certificate
        env:
          MACOS_CERT_P12_BASE64: ${{ secrets.MACOS_CERT_P12_BASE64 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ -z "${MACOS_CERT_P12_BASE64}" ]]; then
            echo "No signing certificate configured; the release will use ad-hoc signing."
            echo "DEVELOPER_ID_CONFIGURED=0" >> "${GITHUB_ENV}"
            exit 0
          fi

          : "${MACOS_CERT_PASSWORD:?MACOS_CERT_PASSWORD is required when a certificate is configured}"
          : "${KEYCHAIN_PASSWORD:?KEYCHAIN_PASSWORD is required when a certificate is configured}"

          KEYCHAIN_PATH="${RUNNER_TEMP}/build.keychain-db"
          CERT_PATH="${RUNNER_TEMP}/cert.p12"

          printf '%s' "${MACOS_CERT_P12_BASE64}" | base64 --decode > "${CERT_PATH}"
          security create-keychain -p "${KEYCHAIN_PASSWORD}" "${KEYCHAIN_PATH}"
          security set-keychain-settings -lut 21600 "${KEYCHAIN_PATH}"
          security unlock-keychain -p "${KEYCHAIN_PASSWORD}" "${KEYCHAIN_PATH}"
          security import "${CERT_PATH}" -k "${KEYCHAIN_PATH}" -P "${MACOS_CERT_PASSWORD}" -T /usr/bin/codesign -T /usr/bin/security
          security list-keychains -d user -s "${KEYCHAIN_PATH}"
          echo "DEVELOPER_ID_CONFIGURED=1" >> "${GITHUB_ENV}"

      - name: Build release app
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${RELEASE_TAG#v}"
          xcodebuild \
            -project BLEUnlock.xcodeproj \
            -scheme BLEUnlock \
            -configuration Release \
            -derivedDataPath build \
            MARKETING_VERSION="${VERSION}" \
            CURRENT_PROJECT_VERSION="${GITHUB_RUN_NUMBER}" \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Sign release app
        env:
          MACOS_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
          MACOS_ENTITLEMENTS_PATH: BLEUnlock/BLEUnlock.entitlements
        shell: bash
        run: |
          set -euo pipefail
          APP_PATH="build/Build/Products/Release/BLEUnlock.app"
          if [[ "${DEVELOPER_ID_CONFIGURED:-0}" != "1" ]]; then
            export MACOS_SIGNING_IDENTITY="-"
          fi
          bash scripts/sign-macos-app.sh "${APP_PATH}"

          if /usr/bin/codesign --display --verbose=4 "${APP_PATH}" 2>&1 | grep -q '^Signature=adhoc$'; then
            echo "APP_SIGNING_MODE=adhoc" >> "${GITHUB_ENV}"
          else
            echo "APP_SIGNING_MODE=developer-id" >> "${GITHUB_ENV}"
          fi

      - name: Verify app metadata
        shell: bash
        run: |
          set -euo pipefail
          APP_PATH="build/Build/Products/Release/BLEUnlock.app"
          VERSION="${RELEASE_TAG#v}"
          ACTUAL_VERSION="$(defaults read "${PWD}/${APP_PATH}/Contents/Info" CFBundleShortVersionString)"
          BUNDLE_ID="$(defaults read "${PWD}/${APP_PATH}/Contents/Info" CFBundleIdentifier)"

          [[ "${ACTUAL_VERSION}" == "${VERSION}" ]] || {
            echo "Expected app version ${VERSION}, got ${ACTUAL_VERSION}." >&2
            exit 1
          }
          [[ "${BUNDLE_ID}" == "com.bifrost-proxy.BLEUnlock" ]] || {
            echo "Unexpected bundle identifier: ${BUNDLE_ID}." >&2
            exit 1
          }

      - name: Package DMG
        shell: bash
        run: |
          set -euo pipefail
          npm install --global create-dmg

          APP_PATH="build/Build/Products/Release/BLEUnlock.app"
          DEST_DIR="build/Build/Products/Release"
          DMG_PATH="${DEST_DIR}/BLEUnlock-${RELEASE_TAG}.dmg"

          create-dmg \
            --overwrite \
            --no-code-sign \
            --no-version-in-filename \
            "${APP_PATH}" \
            "${DEST_DIR}"
          mv "${DEST_DIR}/BLEUnlock.dmg" "${DMG_PATH}"

          cd "${DEST_DIR}"
          shasum -a 256 "$(basename "${DMG_PATH}")" > "$(basename "${DMG_PATH}").sha256"

      - name: Verify packaged DMG
        shell: bash
        run: bash scripts/verify-macos-dmg.sh "build/Build/Products/Release/BLEUnlock-${RELEASE_TAG}.dmg"

      - name: Notarize DMG
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          DMG_PATH="build/Build/Products/Release/BLEUnlock-${RELEASE_TAG}.dmg"

          if [[ -z "${APPLE_ID}${APPLE_TEAM_ID}${APPLE_APP_PASSWORD}" ]]; then
            echo "Notarization credentials are not configured; skipping notarization."
            exit 0
          fi

          if [[ "${APP_SIGNING_MODE:-adhoc}" != "developer-id" ]]; then
            echo "Notarization credentials are configured, but the app is only ad-hoc signed." >&2
            echo "Configure a Developer ID Application certificate and MACOS_SIGNING_IDENTITY." >&2
            exit 1
          fi

          : "${APPLE_ID:?APPLE_ID is required for notarization}"
          : "${APPLE_TEAM_ID:?APPLE_TEAM_ID is required for notarization}"
          : "${APPLE_APP_PASSWORD:?APPLE_APP_PASSWORD is required for notarization}"

          xcrun notarytool submit "${DMG_PATH}" \
            --apple-id "${APPLE_ID}" \
            --team-id "${APPLE_TEAM_ID}" \
            --password "${APPLE_APP_PASSWORD}" \
            --wait
          xcrun stapler staple "${DMG_PATH}"
          xcrun stapler validate "${DMG_PATH}"
          spctl --assess --type open --context context:primary-signature --verbose=4 "${DMG_PATH}"
          bash scripts/verify-macos-dmg.sh "${DMG_PATH}"

          cd "$(dirname "${DMG_PATH}")"
          shasum -a 256 "$(basename "${DMG_PATH}")" > "$(basename "${DMG_PATH}").sha256"

      - name: Build release notes
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          import os
          import re
          from pathlib import Path

          version = os.environ["RELEASE_TAG"].removeprefix("v")

          def section(path: str) -> str:
              text = Path(path).read_text()
              match = re.search(
                  rf"^## {re.escape(version)}\s*$\n(.*?)(?=^## |\Z)",
                  text,
                  re.MULTILINE | re.DOTALL,
              )
              return match.group(1).strip() if match else ""

          notes = [section("CHANGELOG.md")]
          translations = [("中文发布说明", section("CHANGELOG.cn.md"))]
          for summary, body in translations:
              if body:
                  notes.append(
                      f"<details>\n<summary>{summary}</summary>\n\n{body}\n\n</details>"
                  )

          Path("release-notes.md").write_text("\n\n".join(filter(None, notes)) + "\n")
          PY

      - name: Test installer against verified local artifact
        shell: bash
        run: bash scripts/test-install-script.sh "build/Build/Products/Release/BLEUnlock-${RELEASE_TAG}.dmg" "${RELEASE_TAG}"

      - name: Create annotated tag after local verification
        if: ${{ env.RELEASE_TAG_EXISTS == '0' }}
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          HEAD_COMMIT="$(git rev-parse HEAD)"
          REMOTE_MASTER="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/master" --jq .object.sha)"
          [[ "${REMOTE_MASTER}" == "${HEAD_COMMIT}" ]] || {
            echo "Master advanced during the build; rerun from the new validated master." >&2
            exit 1
          }
          TAG_OBJECT="$(gh api --method POST "repos/${GITHUB_REPOSITORY}/git/tags" \
            -f tag="${RELEASE_TAG}" -f message="BLEUnlock ${RELEASE_TAG}" \
            -f object="${HEAD_COMMIT}" -f type=commit --jq .sha)"
          gh api --method POST "repos/${GITHUB_REPOSITORY}/git/refs" \
            -f ref="refs/tags/${RELEASE_TAG}" -f sha="${TAG_OBJECT}"
          # GITHUB_TOKEN-created tags do not recursively start another run.
          # This dispatch continues through draft / publish / public checks.

      - name: Prepare draft and verify uploaded assets
        id: prepare
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          DMG_PATH="build/Build/Products/Release/BLEUnlock-${RELEASE_TAG}.dmg"
          CHECKSUM_PATH="${DMG_PATH}.sha256"
          if gh release view "${RELEASE_TAG}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            IS_DRAFT="$(gh release view "${RELEASE_TAG}" --repo "${GITHUB_REPOSITORY}" --json isDraft --jq .isDraft)"
            if [[ "${IS_DRAFT}" != "true" ]]; then
              echo "Release already public: keep assets unchanged and verify the public installer."
              echo "already_public=true" >> "${GITHUB_OUTPUT}"
              exit 0
            fi
            gh release edit "${RELEASE_TAG}" --repo "${GITHUB_REPOSITORY}" \
              --title "BLEUnlock ${RELEASE_TAG}" --notes-file release-notes.md
          else
            gh release create "${RELEASE_TAG}" --repo "${GITHUB_REPOSITORY}" \
              --verify-tag --draft --title "BLEUnlock ${RELEASE_TAG}" --notes-file release-notes.md
          fi
          gh release upload "${RELEASE_TAG}" "${DMG_PATH}" "${CHECKSUM_PATH}" \
            --repo "${GITHUB_REPOSITORY}" --clobber
          DRAFT_DIR="${RUNNER_TEMP}/draft-assets"
          mkdir -p "${DRAFT_DIR}"
          gh release download "${RELEASE_TAG}" --repo "${GITHUB_REPOSITORY}" \
            --dir "${DRAFT_DIR}" --pattern 'BLEUnlock-*.dmg*' --clobber
          (cd "${DRAFT_DIR}" && shasum -a 256 -c "$(basename "${CHECKSUM_PATH}")")
          cmp "${DMG_PATH}" "${DRAFT_DIR}/$(basename "${DMG_PATH}")"

      - name: Publish verified draft
        if: ${{ steps.prepare.outputs.already_public != 'true' }}
        id: publish
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh release edit "${RELEASE_TAG}" --repo "${GITHUB_REPOSITORY}" --draft=false --latest

      - name: Verify anonymous public installation
        shell: bash
        run: |
          set -euo pipefail
          # Draft assets have no anonymous download URL. Test the public path
          # only after publishing; credentials are intentionally absent here.
          INSTALL_DIR="${RUNNER_TEMP}/public-script-install"
          mkdir -p "${INSTALL_DIR}"
          BLEUNLOCK_INSTALL_DIR="${INSTALL_DIR}" \
            bash install.sh --version "${RELEASE_TAG}" --no-launch
          APP_PATH="${INSTALL_DIR}/BLEUnlock.app"
          [[ "$(defaults read "${APP_PATH}/Contents/Info" CFBundleShortVersionString)" == "${RELEASE_TAG#v}" ]]
          [[ "$(defaults read "${APP_PATH}/Contents/Info" CFBundleIdentifier)" == "com.bifrost-proxy.BLEUnlock" ]]
          codesign --verify --deep --strict --verbose=4 "${APP_PATH}"

      - name: Withdraw release after public verification failure
        if: ${{ failure() && steps.publish.outcome == 'success' }}
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          echo "Public installation verification failed; withdrawing this release to draft." >&2
          gh release edit "${RELEASE_TAG}" --repo "${GITHUB_REPOSITORY}" --latest=false --draft=true
